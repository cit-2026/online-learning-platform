<body>

<header>
    <h1>CHAND INSTITUTE OF TECHNOLOGY</h1>
    <p>Learn • Practice • Innovate • Succeed</p>
</header>

<main class="container">
    <h2>Create Student Account</h2>
    <p style="text-align:center">
        Register to access our online learning platform.
    </p>

    <div id="message" role="status" aria-live="polite"></div>

    <form id="registerForm">

        <div class="field">
            <label for="fullName">Full Name</label>
            <input
                type="text"
                id="fullName"
                maxlength="100"
                autocomplete="name"
                required
            >
        </div>

        <div class="field">
            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                autocomplete="email"
                required
            >
        </div>

        <div class="field">
            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                minlength="8"
                autocomplete="new-password"
                required
            >
        </div>

        <div class="field">
            <label for="confirmPassword">Confirm Password</label>
            <input
                type="password"
                id="confirmPassword"
                minlength="8"
                autocomplete="new-password"
                required
            >
        </div>

        <button type="submit" id="registerBtn">
            Register Now
        </button>

    </form>

    <div class="links">
        Already have an account?
        <a href="login.html">Login here</a>
    </div>
</main>

<footer>
    &copy; 2026 CHAND INSTITUTE OF TECHNOLOGY
</footer>

<!-- Supabase JavaScript library -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    // Tumia URL ya Supabase project yako iliyopo.
    const SUPABASE_URL =
        "https://onfrahdbophlwamtooqw.supabase.co";

    // Weka Supabase publishable key au legacy anon key hapa.
    const SUPABASE_KEY = "WEKA_SUPABASE_PUBLISHABLE_KEY_YAKO";

    const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

    const form = document.getElementById("registerForm");
    const button = document.getElementById("registerBtn");
    const message = document.getElementById("message");

    function showMessage(text, type) {
        message.textContent = text;
        message.className = type;
    }

    form.addEventListener("submit", async function(event) {
        event.preventDefault();

        const fullName =
            document.getElementById("fullName").value.trim();

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;

        const confirmPassword =
            document.getElementById("confirmPassword").value;

        message.className = "";
        message.textContent = "";

        if (!fullName) {
            showMessage("Please enter your full name.", "error");
            return;
        }

        if (password.length < 8) {
            showMessage(
                "Password must contain at least 8 characters.",
                "error"
            );
            return;
        }

        if (password !== confirmPassword) {
            showMessage("Passwords do not match!", "error");
            return;
        }

        button.disabled = true;
        button.textContent = "Registering...";

        try {
            const { data, error } =
                await supabaseClient.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: {
                            full_name: fullName
                        },
                        emailRedirectTo:
                            window.location.origin +
                            window.location.pathname.replace(
                                /register\.html$/,
                                "login.html"
                            )
                    }
                });

            if (error) {
                throw error;
            }

            if (data.session) {
                showMessage(
                    "Registration successful! Redirecting to dashboard...",
                    "success"
                );

                setTimeout(function() {
                    window.location.href = "student-dashboard.html";
                }, 1500);

            } else {
                showMessage(
                    "Registration received! Check your email to confirm your account, then log in.",
                    "success"
                );

                form.reset();
            }

        } catch (error) {
            showMessage(
                error.message || "Registration failed. Please try again.",
                "error"
            );
        } finally {
            button.disabled = false;
            button.textContent = "Register Now";
        }
    });
</script>

</body>
</html>
